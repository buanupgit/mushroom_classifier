[project]
name = "my-streamlit-app"
version = "0.1.0"
description = "Streamlit app with TensorFlow"
# This line is the most important for your error:
requires-python = "==3.10.*"

dependencies = [
    "streamlit",
    "tensorflow==2.13.0",
    "numpy<2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
